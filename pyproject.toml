[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-terminal-backend"
version = "0.9.0"
description = "Windows native modular real-time voice terminal backend"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
cache_dir = ".local/cache/pytest" # cache_dir（测试缓存）。
asyncio_default_fixture_loop_scope = "function" # 异步夹具循环生命周期。
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
  # aec-audio-processing==1.0.1 ships a CPython 3.12 SWIG extension whose
  # generated helper types lack __module__.  Ignore only its known third-party
  # import warnings; do not suppress other deprecations.
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
