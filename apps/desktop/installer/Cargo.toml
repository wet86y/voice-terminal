[package]
name = "voice-terminal-installer"
version.workspace = true
edition.workspace = true

[[bin]]
name = "VoiceTerminalSetup"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]
qualification = [] # qualification（隔离验收）：允许自动选择受限测试工作区。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
voice-desktop-common = { path = "../common" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
