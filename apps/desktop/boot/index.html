<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Terminal · 语音终端</title><link rel="icon" type="image/svg+xml" href="app-icon.svg"><link rel="stylesheet" href="startup.css"><style>html,body{margin:0;background:#0e1118;color:#edf0f7;font-family:"Segoe UI","Microsoft YaHei",sans-serif}.startup-screen{position:fixed;inset:0;display:grid;place-items:center;padding:32px 24px;box-sizing:border-box}.startup-content{width:min(320px,100%);text-align:center}.startup-icon{display:block;margin:0 auto 24px}.startup-title{font-size:18px}.startup-status{font-size:12px;overflow-wrap:anywhere}button[hidden]{display:none!important}</style></head>
<body><main class="startup-screen" role="status"><section class="startup-content">
<img class="startup-icon" src="app-icon.svg" alt="语音终端" width="72" height="72">
<h1 class="startup-title" id="title">应用启动中</h1>
<p class="startup-status" id="message" aria-live="polite">正在准备启动界面</p>
<div class="startup-progress" id="progress" data-indeterminate="true" role="progressbar" aria-label="应用启动进度"><span class="startup-progress-fill"></span></div>
<div class="startup-actions" style="flex-wrap:wrap;justify-content:center"><button class="startup-button" id="choose" hidden>选择工作区</button><button class="startup-button" id="reselect" hidden>重选目录</button><button class="startup-button" id="retry" hidden>重试</button><button class="startup-button" id="cancel" hidden>取消展开</button><button class="startup-button" id="manage" hidden>进入组件管理</button><button class="startup-button" id="skip" hidden>跳过</button><button class="startup-button" id="exit">退出</button></div>
</section></main><script>
// Startup state（加载状态）：启动、安装、迁移、失败和退出共用同一图标、布局与进度条。
const invoke=(name,args)=>window.__TAURI__.core.invoke(name,args),element=id=>document.getElementById(id);
let busy=false,lastState,exiting=false;
window.addEventListener('voice-terminal:exiting',()=>{exiting=true;document.querySelector('.startup-screen').classList.add('is-exiting');element('title').textContent='正在退出应用';element('message').textContent='正在关闭本地组件';element('message').classList.remove('is-error');element('progress').dataset.indeterminate='true';element('progress').setAttribute('aria-label','应用退出进度');document.querySelector('.startup-progress-fill').removeAttribute('style');});
function showError(failure){if(exiting)return;const migration=lastState?.role==='workspace-task';element('title').textContent=migration?'程序迁移未完成':lastState?.operation==='integrity'?'完整性校验未完成':lastState?.operation==='update'?'程序更新未完成':'初始化尚未完成';element('message').textContent=String(failure);element('message').classList.add('is-error');element('retry').hidden=migration;element('reselect').hidden=lastState?.role!=='installer'||lastState?.operation==='integrity'||lastState?.operation==='update';}
async function initialize(reselect){busy=true;element('message').classList.remove('is-error');try{await invoke('desktop_initialize',{reselect});}catch(failure){showError(failure);}finally{busy=false;}}
async function readStatus(){let timer;try{return await Promise.race([invoke('desktop_status'),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('读取启动状态超时，请重试或退出后重新启动。')),10000);})]);}finally{clearTimeout(timer);}}
window.addEventListener('error',event=>{if(event.error||event.message)showError(event.error||event.message);});
window.addEventListener('unhandledrejection',event=>showError(event.reason||'启动界面出现错误，请重试。'));
async function refresh(){if(exiting)return;try{const state=await readStatus();if(exiting)return;lastState=state;
const installer=state.role==='installer',repair=state.operation==='integrity',updating=state.operation==='update',migration=state.role==='workspace-task',init=state.initialization||{},preparing=busy||state.workspace_busy;
element('choose').hidden=!installer||repair||updating||preparing||!!state.error;element('reselect').hidden=!installer||repair||updating||preparing||!state.error;element('retry').hidden=migration||preparing||(!state.error&&init.cancelled!==true);element('cancel').hidden=(!installer&&!migration)||init.can_cancel!==true;element('cancel').textContent=migration?'取消迁移':repair?'取消校验':updating?'取消更新':'取消展开';element('manage').hidden=installer||migration||!state.workspace_ready;element('skip').hidden=installer||migration||!state.workspace_ready||init.components_ready!==true;element('exit').disabled=preparing&&init.can_cancel!==true&&init.cancelling!==true;
if(state.error)showError(state.error);else{element('title').textContent=init.cancelled===true?'校验已取消':migration?'程序迁移中':installer?(repair?'校验与修复':updating?'正在更新语音终端':preparing?'正在准备工作区':'安装语音终端'):'应用启动中';element('message').textContent=migration?init.phase||'正在准备工作区迁移':preparing?init.phase||'正在展开程序本体':installer?init.phase||'请选择文件夹作为整个工作区':init.phase||'正在检查必要启动条件';element('message').classList.remove('is-error');}
const total=init.total_bytes||0,done=init.completed_bytes||0,progress=element('progress');progress.hidden=init.cancelled===true;progress.dataset.indeterminate=String(!total);progress.setAttribute('aria-label',migration?'程序迁移进度':repair?'完整性校验进度':updating?'程序更新进度':'应用加载进度');progress.setAttribute('aria-valuemin','0');progress.setAttribute('aria-valuemax','100');const fill=document.querySelector('.startup-progress-fill');if(total){const percent=Math.max(0,Math.min(100,done*100/total));fill.style.animation='none';fill.style.width=percent+'%';progress.setAttribute('aria-valuenow',String(Math.round(percent)));}else{fill.removeAttribute('style');progress.removeAttribute('aria-valuenow');}
}catch(failure){if(!exiting)showError(failure);}if(!exiting)setTimeout(refresh,300);}
element('choose').onclick=()=>initialize(true);element('reselect').onclick=()=>initialize(true);element('retry').onclick=()=>!lastState?refresh():lastState.role==='installer'?initialize(false):invoke('desktop_start_service').catch(showError);element('cancel').onclick=()=>invoke('desktop_cancel_init').catch(showError);element('manage').onclick=()=>invoke('desktop_manage').catch(showError);element('skip').onclick=()=>invoke('skip_startup').catch(showError);element('exit').onclick=()=>invoke('exit_application').catch(showError);refresh();
</script></body></html>
