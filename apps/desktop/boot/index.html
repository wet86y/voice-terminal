<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Terminal · 语音终端</title><link rel="icon" type="image/svg+xml" href="app-icon.svg">
<style>html{color-scheme:dark;background:#0e1118;color:#edf0f7;font:15px/1.7 system-ui}body{margin:0;display:grid;place-items:center;height:100vh}main{width:min(540px,80vw)}small{color:#929baf}h1{font-size:30px;letter-spacing:-1px}pre{white-space:pre-wrap;color:#eeadb8;font:inherit}button{background:#b2baff;color:#101222;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}.symbol{display:block;width:64px;height:64px;margin-bottom:16px}</style>
<main><img class="symbol" src="app-icon.svg" alt="" width="64" height="64"><small id="mode">桌面宿主启动中</small><h1 id="title">正在建立桌面工作台</h1><p id="message">窗口已就绪，正在等待本机页面。</p><pre id="error"></pre><button id="exit" hidden>退出应用</button></main>
<script>const invoke=(name,args)=>window.__TAURI__.core.invoke(name,args);async function refresh(){try{const state=await invoke('desktop_status');const mode=state.frontend_mode==='ui-preview'?'桌面样例':'产品工作台';document.getElementById('mode').textContent=mode+' · '+(state.development?'调试构建':'正式构建');if(state.error){document.getElementById('title').textContent='启动需要处理';document.getElementById('message').textContent=state.frontend_mode==='ui-preview'?'请检查 Node（脚本运行时）、5174 端口及样例服务日志。':'请检查产品运行环境与服务入口日志。';document.getElementById('error').textContent=state.error;document.getElementById('exit').hidden=false;return;}if(!state.ready)setTimeout(refresh,300);}catch(error){document.getElementById('error').textContent=String(error);}}document.getElementById('exit').onclick=()=>invoke('exit_application');refresh();</script></html>
