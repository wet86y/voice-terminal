<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Terminal · 语音终端</title>
<style>html{color-scheme:dark;background:#0e1118;color:#edf0f7;font:15px/1.7 system-ui}body{margin:0;display:grid;place-items:center;height:100vh}main{width:min(540px,80vw)}small{color:#929baf}h1{font-size:30px;letter-spacing:-1px}pre{white-space:pre-wrap;color:#eeadb8;font:inherit}button{background:#b2baff;color:#101222;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}.symbol{font-size:40px;color:#b2baff}</style>
<main><div class="symbol">◉</div><small>VOICE TERMINAL · 语音终端</small><h1 id="title">正在建立桌面工作台</h1><p id="message">窗口已就绪，正在等待本地服务入口。</p><pre id="error"></pre><button id="exit" hidden>退出应用</button></main>
<script>const invoke=(name,args)=>window.__TAURI__.core.invoke(name,args);async function refresh(){try{const state=await invoke('desktop_status');if(state.error){document.getElementById('title').textContent='启动需要处理';document.getElementById('message').textContent='请检查解释器、用户数据位置及日志。';document.getElementById('error').textContent=state.error;document.getElementById('exit').hidden=false;return;}if(!state.ready)setTimeout(refresh,300);}catch(error){document.getElementById('error').textContent=String(error);}}document.getElementById('exit').onclick=()=>invoke('exit_application');refresh();</script></html>
