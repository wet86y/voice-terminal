<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Terminal · 语音终端</title><link rel="icon" type="image/svg+xml" href="app-icon.svg"><link rel="stylesheet" href="startup.css"><style>html,body{margin:0;background:#0e1118}</style></head>
<body><main class="startup-screen" role="status"><section class="startup-content">
<img class="startup-icon" src="app-icon.svg" alt="语音终端" width="72" height="72">
<h1 class="startup-title" id="title">应用启动中</h1>
<p class="startup-status" id="message" aria-live="polite">正在启动界面服务</p>
<div class="startup-progress" id="progress" data-indeterminate="true" role="progressbar" aria-label="应用启动进度"><span class="startup-progress-fill"></span></div>
<div class="startup-actions"><button class="startup-button" id="skip" type="button">跳过</button><button class="startup-button" id="exit" type="button" hidden>退出应用</button></div>
</section></main><script>
const invoke=(name)=>window.__TAURI__.core.invoke(name);
const title=document.getElementById('title'),message=document.getElementById('message'),skip=document.getElementById('skip'),exit=document.getElementById('exit');
function showError(error){title.textContent='启动遇到问题';message.textContent=String(error);message.classList.add('is-error');document.getElementById('progress').hidden=true;skip.hidden=true;exit.hidden=false;}
async function refresh(){try{const state=await invoke('desktop_status');if(state.error){showError(state.error);return;}if(state.startup_skipped){skip.disabled=true;skip.textContent='正在打开设置';}if(!state.ready)setTimeout(refresh,300);}catch(error){showError(error);}}
skip.onclick=async()=>{skip.disabled=true;try{await invoke('skip_startup');skip.textContent='正在打开设置';}catch(error){skip.disabled=false;showError(error);}};
exit.onclick=()=>invoke('exit_application');refresh();
</script></body></html>
