# Opt-in configuration: pass --config config/v0.2.yaml to server/worker.
v02:
  enabled: true
  smart_turn: true
  sensevoice: true
  predictions: true
  tools: true
  max_turn_ms: 60000
  # Keep the complete returned audio queue at most two seconds ahead of
  # playback before releasing the next text batch to MiniMax.
  tts_pacing: true
  tts_lead_ms: 2000
  allowed_roots: [docs]

# Keep streaming TTS sentence-oriented.  Commas and enumeration pauses remain
# in the text but do not create a burst of tiny task_continue frames.
text_bridge:
  preferred_breaks: "。！？；"

# Let Windows/PortAudio select the current default output device. This is useful
# when an external speaker or headset is connected after the service starts.
audio:
  output_device: null
