model_dir: "D:\\模型\\voice-terminal"
debug_audio_capture: false

# The only runtime: audio input refinement is independently configurable.
smart_turn:
  smart_turn: true
  sensevoice: true
  analysis_url: ws://127.0.0.1:8767/analysis
  candidate_ms: 500
  recheck_ms: 200
  smart_timeout_ms: 300
  hard_silence_ms: 1400
  max_turn_ms: 60000
tools:
  enabled: true
  web_search: true
  allowed_roots: [docs]

# Episode-scoped Markdown context. Files are read when a new Agent episode
# starts and remain frozen for that episode.
persona:
  directory: config/persona
  personality_file: personality.md
  user_file: user.md
  instructions_file: instructions.md

audio:
  input_device: "麦克风阵列 (适用于数字麦克风的英特尔® 智音技术)"
  # Let Windows select the active default device. This avoids pinning an MME
  # endpoint that may advertise support but fail when PortAudio opens it.
  output_device: null
  sample_rate: 16000
  channels: 1
  sample_format: int16
  block_ms: 20
  ring_buffer_ms: 2000
  wake_preroll_ms: 1200
  # Speaker playback is safe even without the optional AEC wheel: automatic
  # barge-in is then disabled after the first output callback rather than
  # falling back to raw microphone VAD and cancelling the assistant by echo.
  processing_enabled: false
  processing_required: false
  echo_cancellation: true
  noise_suppression: true
  automatic_gain_control: false
  device_latency_ms: 0

wake:
  enabled: false
  provider: sherpa_kws
  keyword: "hei claw"
  keyword_label: "HEI_CLAW"
  threshold: 0.25
  keywords_score: 1.0
  num_trailing_blanks: 1
  device: cpu

vad:
  model: fsmn-vad
  min_speech_ms: 250
  # Smart Turn uses a 300 ms VAD end boundary and then applies the
  # candidate/recheck/hard-silence policy above.
  end_silence_ms: 300
  max_turn_ms: 15000

asr:
  provider: funasr
  model: paraformer-zh-streaming
  device: auto
  worker_url: ws://127.0.0.1:8766/asr
  chunk_size: [0, 10, 5]
  encoder_chunk_look_back: 4
  decoder_chunk_look_back: 1

llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  stream: true
  # Active test lane. The frozen chat_completions adapter remains available
  # only as an explicit rollback and is not called during normal operation.
  transport: responses
  reasoning_mode: balanced
  thinking: enabled
  reasoning_effort: low
  timeout_ms: 15000
  max_output_tokens: 512
  # Ordinary dual-running is disabled: all current decisions use Responses.
  # Shadow is reserved for the later thinking experiment only.
  shadow_enabled: false
  shadow_sample_rate: 1.0
  shadow_thinking_enabled: false
  # Experimental control action; intentionally independent from transport.
  thinking_action_enabled: false
  protocol_recovery_limit: 1
  # Transient HTTP failures are a separate, bounded retry lane.
  transport_retry_limit: 2

tts:
  provider: minimax
  base_url: https://api.minimaxi.com
  websocket_path: /ws/v1/t2a_v2
  transport: websocket_bidi
  scheduling: direct
  subtitle_enable: true
  subtitle_type: word_streaming
  audio_cache_max_bytes: 67108864
  cancel_timeout_ms: 2000
  keepalive_seconds: 30
  emotion_mode: agent
  default_emotion: calm
  emotion_transport: voice_setting
  session_reuse: true
  model: speech-2.8-hd
  api_key_env: MINIMAX_API_KEY
  output_format: pcm
  sample_rate: 32000
  voice_id: female-shaonv
  timeout_ms: 15000

text_bridge:
  min_chars: 8
  max_chars: 36
  max_wait_ms: 350
  preferred_breaks: "。！？；"

server:
  host: 127.0.0.1
  port: 8765

asr_worker:
  host: 127.0.0.1
  port: 8766

agent:
  enabled: true
  max_context_tokens: 524288
  trace_limit: 200
  output_limit: 32
