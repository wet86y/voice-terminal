model_dir: "D:\\模型\\voice-terminal"
debug_audio_capture: false

# quiet_hours（被动静默时间）：本地每日时间，需先启用 KWS（关键词唤醒）。
quiet_hours:
  enabled: false
  start: "23:00"
  end: "07:00"

# continuity（交接整理）：provider（供应方）省略时继承 shadow_agent.provider（影子模型供应方）。
# 固定以 reasoning_effort=high（高强度思考）调用，服务不支持时报告失败并保留材料。
continuity:
  max_document_chars: 6000  # 交接文档字符上限。
  max_output_tokens: 16384  # 整理输出词元预算。
  max_context_tokens: 524288  # 整理上下文词元预算。

# The only runtime: audio input refinement is independently configurable.
smart_turn:
  smart_turn: true
  sensevoice: true
  analysis_url: ws://127.0.0.1:8767/analysis
  smart_timeout_ms: 300
  hard_silence_ms: 1400
  max_turn_ms: 60000
shadow_agent:
  # Session-scoped single Shadow Agent. The voice model can only wake it;
  # intent and tools are driven from authoritative conversation context.
  enabled: true
  # Fixed when a new Voice Session is created; never hot-switches or fails over.
  backend: dsh
  debug_websocket_enabled: false
  # Experimental sidecar gate only changes injection timing; context remains intact.
  experimental_context_gate_enabled: false
  max_context_tokens: 524288
  compaction_threshold_ratio: 0.80
  # Advisory reminder injected at the next protocol-safe boundary.
  runtime_reminder_interval_ms: 20000
  # Omitted provider fields inherit llm.base_url, llm.model and llm.api_key_env.
  provider:
    # null means Shadow has no local request deadline or retry-count ceiling.
    # reset/close/cancellation and provider-side terminal failures still apply.
    timeout_ms: null
    transport_retry_limit: null
  status_observer:
    enabled: true
    every_committed_steps: 5
    reasoning_effort: none
    max_output_tokens: 512
    timeout_ms: null
  tools:
    files_enabled: true
    allowed_roots: [docs]
    # Return control to Shadow after this interval while the read-only work
    # continues in the background. This is not a cancellation deadline.
    soft_yield_ms: 8000
    web_search:
      enabled: true
      base_url: https://api.minimaxi.com
      api_key_env: MINIMAX_API_KEY
      timeout_ms: 15000

dsh:
  enabled: true
  auto_start: true
  source_dir: .runtime/dsh/source
  home_dir: .runtime/dsh/home
  profile: web
  host: 127.0.0.1
  port: 3081
  startup_timeout_ms: 120000
  shutdown_timeout_ms: 5000
  bridge_timeout_ms: 15000
  bridge_protocol_version: "2.0"
  restart_limit: 2
  restart_delay_ms: 1000
  expected_version: 0.2.0-rc.2
  expected_commit: 639ed015397290b3745d163aafe02ffee4aa3f84

# Episode-scoped Markdown context. Files are read when a new Agent episode
# starts and remain frozen for that episode.
persona:
  directory: config/persona
  personality_file: personality.md
  user_file: user.md
  instructions_file: instructions.md

audio:
  input_device: "麦克风阵列 (适用于数字麦克风的英特尔® 智音技术)"
  # Let Windows select the active default device. This avoids pinning an MME
  # endpoint that may advertise support but fail when PortAudio opens it.
  output_device: null
  sample_rate: 16000
  channels: 1
  sample_format: int16
  block_ms: 20
  ring_buffer_ms: 2000
  wake_preroll_ms: 1200
  # AEC is on by default. During speaker playback only processed, confirmed
  # near-end speech may interrupt; raw microphone VAD is never a fallback.
  processing_enabled: true
  processing_required: false
  # pause_recover | stop_and_listen | continue_without_barge_in
  aec_failure_policy: pause_recover
  echo_cancellation: true
  noise_suppression: true
  automatic_gain_control: false
  device_latency_ms: 0

wake:
  enabled: false
  provider: sherpa_kws
  keyword: "hei claw"
  keyword_label: "HEI_CLAW"
  # Optional list of wake phrases (at most 5).  When present it is the
  # authoritative set the spotter matches, and `keyword`/`keyword_label` are
  # kept in sync with its first entry; when absent the single `keyword` is used.
  keywords: ["hei claw"]
  threshold: 0.25
  # Boosting score per keyword token.  1.5 is the measured sweet spot: it
  # repairs the 8 dB band and lifts "你好七三" from 5/9 to 7/9 at 5 dB, while
  # 2.0 shows no further gain on the same corpus.
  keywords_score: 1.5
  # 3 costs no recall and keeps overlapping phrases (七三 vs 七三同学) from
  # being merged into one another.
  num_trailing_blanks: 3
  # Beam width.  8 is the only knob measured to improve the bare two-syllable
  # "七三" (5 dB recall 3/9 -> 5/9) with no false accepts on the 7.3-minute
  # wake-word-free corpus.
  max_active_paths: 8
  device: cpu

vad:
  model: fsmn-vad
  min_speech_ms: 250
  # One SmartTurn check starts at this VAD end boundary; hard silence remains a fallback.
  end_silence_ms: 200
  max_turn_ms: 15000

asr:
  provider: funasr
  model: paraformer-zh-streaming
  device: auto
  worker_url: ws://127.0.0.1:8766/asr
  chunk_size: [0, 10, 5]
  encoder_chunk_look_back: 4
  decoder_chunk_look_back: 1

llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  stream: true
  # Active test lane. The frozen chat_completions adapter remains available
  # only as an explicit rollback and is not called during normal operation.
  transport: responses
  reasoning_mode: fast  # reasoning_mode（运行模式）：fast（快速）或 deep（深度）。
  thinking: enabled
  reasoning_effort: low
  timeout_ms: 15000
  # DeepSeek's documented maximum output budget: 384K tokens.
  max_output_tokens: 393216
  protocol_recovery_limit: 1
  # Transient HTTP failures are a separate, bounded retry lane.
  transport_retry_limit: 2

tts:
  # backend（语音后端）：当前产品固定使用 MiniMax API（在线语音接口）；兼容路由层保留本地扩展位。
  backend: minimax
  provider: minimax
  base_url: https://api.minimaxi.com
  websocket_path: /ws/v1/t2a_v2
  transport: websocket
  # Split model output at spoken punctuation.  Keep at most the current block
  # plus one block prefetched on the same task_start connection.
  scheduling: sentence_window
  sentence_prefetch_ms: 2000
  sentence_tick_ms: 50
  first_clause_timeout_ms: 400
  # Retained for the legacy playback_window compatibility mode.
  admission_lead_ms: 2500
  subtitle_enable: false
  subtitle_type: word_streaming
  audio_cache_max_bytes: 67108864
  cancel_timeout_ms: 2000
  keepalive_seconds: 30
  emotion_mode: agent
  default_emotion: calm
  emotion_transport: voice_setting
  session_reuse: true
  model: speech-2.8-hd
  api_key_env: MINIMAX_API_KEY
  output_format: pcm
  sample_rate: 32000
  voice_id: female-shaonv
  timeout_ms: 15000

text_bridge:
  min_chars: 8
  max_chars: 36
  max_wait_ms: 350
  preferred_breaks: "。！？；"

server:
  host: 127.0.0.1
  port: 8765

asr_worker:
  host: 127.0.0.1
  port: 8766

speaker:
  # Optional sidecar.  off | observe | filter
  mode: off
  owner_only_barge_in: false # 主人专属打断开关；与声纹模式独立
  # confirm_threshold（确认阈值）和 continuity_threshold（连续保持阈值）使用
  # 注册质心上的原始余弦分数。最终分数是整轮聚合向量与质心的余弦值；
  # 现场测试使用相同口径。参考语料同人 p05≈0.86、异人 p95≈0.19，
  # 但该语料不能替代真实用户校准。
  confirm_threshold: 0.60
  continuity_threshold: 0.50
  # min_speech_ms（单窗最低人声时长）和 min_window_speech_ratio（单窗最低人声占比）
  # 同时门控；必须满足后才会提取 embedding（说话人向量）。
  window_ms: 2000 # 分析窗长度（毫秒）
  step_ms: 500 # 相邻分析窗步进（毫秒）
  min_speech_ms: 700
  min_window_speech_ratio: 0.40
  # min_turn_speech_ms（整轮最低不重复人声时长）：按 VAD 区间并集计数，
  # 不累加重叠滑窗中重复的语音；低于门槛时状态为 "unknown"（未知）并直通。
  # 2 s 的有效人声通常需要约 2.5-3 s 实际录音。提高该值会减少可判定的短语句，
  # 但可降低误接受风险；
  min_turn_speech_ms: 2000
  wait_ms: 150
  model_id: wespeaker-cnceleb-resnet34 # 声纹嵌入模型标识

speaker_worker:
  host: 127.0.0.1
  # 8767 is reserved for the Smart Turn / SenseVoice analysis worker.
  port: 8768

agent:
  enabled: true
  max_context_tokens: 524288
  trace_limit: 200
  output_limit: 32
