# Agent-controlled speech: pass --config config/v0.3.yaml to server/worker.
v02:
  enabled: true
  smart_turn: true
  sensevoice: true
  predictions: true
  tools: true
  web_search: true
  max_turn_ms: 60000
  tts_local_buffer_ms: 2000
  allowed_roots: [docs]

tts:
  transport: websocket_bidi
  websocket_path: /ws/v1/t2a_v2_bidi
  scheduling: direct
  subtitle_enable: true
  subtitle_type: word_streaming
  audio_cache_max_bytes: 67108864
  cancel_timeout_ms: 2000
  keepalive_seconds: 30

# Keep streaming TTS sentence-oriented.  Commas and enumeration pauses remain
# in the text but do not create a burst of tiny task_continue frames.
text_bridge:
  preferred_breaks: "。！？；"

# Let Windows/PortAudio select the current default output device. This is useful
# when an external speaker or headset is connected after the service starts.
audio:
  output_device: null
  processing_enabled: true
  processing_required: false
  echo_cancellation: true
  noise_suppression: true
  automatic_gain_control: false
  # Conservative device tail when PortAudio has no usable DAC timestamp.
  device_latency_ms: 60

v03:
  enabled: true
  decision_mode: balanced
  balanced_interval_ms: 800
  aggressive_interval_ms: 400
  silence_ms: 5500
  max_requests_per_step: 5
  max_context_chars: 64000
  trace_limit: 200
  output_limit: 32
